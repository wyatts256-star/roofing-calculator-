<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOFBIDDER</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f6f9;
  --card:#fff;
  --text:#172033;
  --muted:#697386;
  --border:#dfe4ec;
  --primary:#1769ff;
  --primary2:#0d55d9;
  --danger:#dc3545;
  --success:#198754;
  --warning:#f59e0b;
  --shadow:0 5px 22px rgba(20,30,50,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#10141b;
  --card:#181e27;
  --text:#f4f7fb;
  --muted:#a8b0bf;
  --border:#2b3442;
  --shadow:0 5px 22px rgba(0,0,0,.25);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

.topbar{
  height:68px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  font-weight:900;
  font-size:21px;
  letter-spacing:.5px;
}

.brand span{
  color:var(--primary);
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
}

.user-pill{
  border:1px solid var(--border);
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
  color:var(--muted);
  max-width:220px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.layout{
  display:flex;
  min-height:calc(100vh - 68px);
}

.sidebar{
  width:230px;
  background:var(--card);
  border-right:1px solid var(--border);
  padding:15px;
  flex-shrink:0;
}

.nav-btn{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--text);
  padding:13px 14px;
  border-radius:10px;
  margin-bottom:5px;
  font-weight:700;
}

.nav-btn:hover,
.nav-btn.active{
  background:rgba(23,105,255,.1);
  color:var(--primary);
}

.main{
  flex:1;
  padding:25px;
  min-width:0;
}

.page{
  max-width:1250px;
  margin:auto;
}

.page-title{
  font-size:28px;
  font-weight:900;
  margin:0 0 5px;
}

.page-sub{
  color:var(--muted);
  margin:0 0 22px;
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.stat-value{
  font-size:27px;
  font-weight:900;
  margin-top:8px;
}

.section-title{
  font-size:18px;
  font-weight:900;
  margin:0 0 15px;
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.field{
  margin-bottom:14px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:800;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary2);
}

.btn-secondary{
  background:var(--border);
  color:var(--text);
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-warning{
  background:var(--warning);
  color:#111;
}

.btn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  white-space:nowrap;
}

th{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.badge-lead{background:#e8eefc;color:#315ca8}
.badge-estimated{background:#fff3cd;color:#946c00}
.badge-sold{background:#d1e7dd;color:#12653d}
.badge-completed{background:#cff4fc;color:#087990}
.badge-lost{background:#f8d7da;color:#842029}

.empty{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
}

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
}

.auth-card{
  width:min(460px,100%);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
  box-shadow:var(--shadow);
}

.auth-logo{
  font-size:31px;
  font-weight:900;
  margin-bottom:4px;
}

.auth-logo span{
  color:var(--primary);
}

.auth-tabs{
  display:flex;
  gap:5px;
  background:var(--bg);
  padding:5px;
  border-radius:10px;
  margin:20px 0;
}

.auth-tabs button{
  flex:1;
  border:0;
  padding:10px;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-weight:800;
}

.auth-tabs button.active{
  background:var(--card);
  color:var(--primary);
  box-shadow:var(--shadow);
}

.notice{
  padding:11px 13px;
  border-radius:9px;
  background:rgba(23,105,255,.1);
  color:var(--primary);
  margin-bottom:15px;
  font-size:13px;
}

.error{
  padding:11px 13px;
  border-radius:9px;
  background:#f8d7da;
  color:#842029;
  margin-bottom:15px;
  font-size:13px;
}

.success{
  padding:11px 13px;
  border-radius:9px;
  background:#d1e7dd;
  color:#12653d;
  margin-bottom:15px;
  font-size:13px;
}

.calculator-results{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-top:16px;
}

.result{
  padding:15px;
  border:1px solid var(--border);
  border-radius:12px;
}

.result-label{
  font-size:12px;
  color:var(--muted);
}

.result-value{
  font-size:22px;
  font-weight:900;
  margin-top:5px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}

.checkbox-row:last-child{
  border-bottom:0;
}

.checkbox-row input{
  width:20px;
  height:20px;
}

.logo-preview{
  width:130px;
  height:80px;
  border:1px dashed var(--border);
  border-radius:10px;
  object-fit:contain;
  background:#fff;
  margin-top:8px;
}

.proposal{
  max-width:900px;
  margin:30px auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.proposal-head{
  padding:30px;
  border-bottom:1px solid var(--border);
}

.proposal-logo{
  max-width:220px;
  max-height:90px;
  object-fit:contain;
}

.proposal-company{
  font-size:28px;
  font-weight:900;
  margin-top:10px;
}

.proposal-body{
  padding:30px;
}

.proposal-price{
  font-size:42px;
  font-weight:900;
  color:var(--primary);
}

.proposal-section{
  margin-top:25px;
}

.proposal-footer{
  padding:20px 30px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:13px;
}

.mobile-menu{
  display:none;
}

@media(max-width:900px){
  .sidebar{
    display:none;
  }

  .mobile-menu{
    display:block;
  }

  .main{
    padding:16px;
  }

  .grid-4,
  .grid-3,
  .grid-2,
  .calculator-results{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .topbar{
    padding:0 10px;
  }

  .user-pill{
    display:none;
  }

  .main{
    padding:12px;
  }

  .grid-4,
  .grid-3,
  .grid-2,
  .calculator-results{
    grid-template-columns:1fr;
  }

  .page-title{
    font-size:23px;
  }

  .proposal-head,
  .proposal-body{
    padding:20px;
  }

  .proposal-price{
    font-size:34px;
  }
}

@media print{
  body{
    background:#fff!important;
  }

  .topbar,
  .sidebar,
  .no-print{
    display:none!important;
  }

  .main{
    padding:0;
  }

  .proposal{
    box-shadow:none;
    border:0;
    margin:0;
    max-width:none;
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>
/* =========================================================
   ROOFBIDDER V8.2.1
   ========================================================= */

const SUPABASE_URL = "https://ovuirmlmdpbqumriakcm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_79QIWXKGoCtpUwF3t4KTRw_A9lAuao3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

/* ---------------------------------------------------------
   GLOBAL STATE
--------------------------------------------------------- */

let currentUser = null;
let currentPage = "dashboard";
let estimates = [];
let editingEstimateId = null;
let companyProfile = {};
let userSettings = {};
let homeownerProfile = {};
let publicProposal = null;
let authMode = "contractor";

const defaultWidgets = {
  revenue:true,
  profit:true,
  soldLost:true,
  closeRate:true,
  followups:true,
  recent:true,
  pipeline:true
};

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

const $ = id => document.getElementById(id);

function money(value){
  return Number(value || 0).toLocaleString("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:2
  });
}

function num(value){
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function notify(message,type="notice"){
  const old = document.querySelector(".toast");
  if(old) old.remove();

  const div = document.createElement("div");
  div.className = "toast";
  div.textContent = message;

  div.style.position = "fixed";
  div.style.bottom = "20px";
  div.style.right = "20px";
  div.style.zIndex = "9999";
  div.style.padding = "13px 17px";
  div.style.borderRadius = "10px";
  div.style.fontWeight = "700";
  div.style.background =
    type === "error" ? "#dc3545" :
    type === "success" ? "#198754" :
    "#1769ff";
  div.style.color = "#fff";
  div.style.boxShadow = "0 8px 30px rgba(0,0,0,.2)";

  document.body.appendChild(div);

  setTimeout(()=>div.remove(),3000);
}

function setTheme(theme){
  const isDark = String(theme).toLowerCase() === "dark";

  document.body.classList.toggle("dark",isDark);

  document.documentElement.setAttribute(
    "data-theme",
    isDark ? "dark" : "light"
  );

  localStorage.setItem(
    "roofbidder_theme",
    isDark ? "dark" : "light"
  );
}

function getTheme(){
  return localStorage.getItem("roofbidder_theme") || "light";
}

function getWidgets(){
  return {
    ...defaultWidgets,
    ...(userSettings.dashboard_widgets || {})
  };
}

function todayPlus(days){
  const d = new Date();
  d.setDate(d.getDate()+Number(days || 30));
  return d.toISOString().slice(0,10);
}

/* ---------------------------------------------------------
   AUTH
--------------------------------------------------------- */

async function init(){

  setTheme(getTheme());

  const params = new URLSearchParams(location.search);
  const token = params.get("proposal");

  if(token){
    await renderPublicProposal(token);
    return;
  }

  const {data} = await supabaseClient.auth.getSession();

  currentUser = data.session?.user || null;

  if(currentUser){
    await bootApp();
  }else{
    renderAuth();
  }

  supabaseClient.auth.onAuthStateChange(async(event,session)=>{
    currentUser = session?.user || null;

    if(currentUser){
      await bootApp();
    }else{
      renderAuth();
    }
  });
}

function renderAuth(){
  document.body.classList.remove("dark");

  $("root").innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">

        <div class="auth-logo">
          ROOF<span>BIDDER</span>
        </div>

        <div style="color:var(--muted)">
          Roofing estimates. Built for profit.
        </div>

        <div class="auth-tabs">
          <button
            class="${authMode==="contractor"?"active":""}"
            onclick="setAuthMode('contractor')">
            Contractor
          </button>

          <button
            class="${authMode==="homeowner"?"active":""}"
            onclick="setAuthMode('homeowner')">
            Homeowner
          </button>
        </div>

        <div id="authBox"></div>

      </div>
    </div>
  `;

  renderAuthForm();
}

function setAuthMode(mode){
  authMode = mode;
  renderAuth();
}

function renderAuthForm(){

  $("authBox").innerHTML = `
    <h2 style="margin-bottom:5px">
      ${authMode==="contractor"
        ? "Contractor Login"
        : "Homeowner Portal"}
    </h2>

    <p style="color:var(--muted);margin-top:0">
      ${authMode==="contractor"
        ? "Manage estimates, pricing and proposals."
        : "View and approve your roofing proposal."}
    </p>

    <div id="authMessage"></div>

    <div class="field">
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="authPassword" type="password" placeholder="Password">
    </div>

    ${
      authMode==="homeowner"
      ? `
      <div class="field">
        <label>Your Name</label>
        <input id="authName" placeholder="John Smith">
      </div>
      `
      :""
    }

    <button
      class="btn btn-primary"
      style="width:100%"
      onclick="loginOrSignup()">
      ${authMode==="contractor"
        ? "Login / Create Account"
        : "Homeowner Login / Sign Up"}
    </button>

    ${
      authMode==="homeowner"
      ? `
      <div class="notice" style="margin-top:15px">
        If a contractor sent you a proposal link,
        open that link first. You can then connect
        the proposal to your homeowner account.
      </div>
      `
      :""
    }
  `;
}

async function loginOrSignup(){

  const email = $("authEmail")?.value.trim();
  const password = $("authPassword")?.value;
  const name = $("authName")?.value.trim() || "";

  if(!email || !password){
    showAuthError("Email and password are required.");
    return;
  }

  const message = authMode==="homeowner"
    ? "Homeowner"
    : "Contractor";

  const signup = await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      data:{
        role:authMode==="homeowner" ? "homeowner" : "contractor",
        full_name:name
      }
    }
  });

  if(!signup.error && signup.data.user){

    if(signup.data.session){
      notify(`${message} account created.`,"success");
      return;
    }

    showAuthSuccess(
      "Account created. Check your email if email confirmation is enabled in Supabase, then log in."
    );

    return;
  }

  const login = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(login.error){
    showAuthError(login.error.message);
    return;
  }

  currentUser = login.data.user;
}

function showAuthError(message){
  const el = $("authMessage");
  if(el){
    el.innerHTML =
      `<div class="error">${esc(message)}</div>`;
  }
}

function showAuthSuccess(message){
  const el = $("authMessage");
  if(el){
    el.innerHTML =
      `<div class="success">${esc(message)}</div>`;
  }
}

async function logout(){
  await supabaseClient.auth.signOut();
}

/* ---------------------------------------------------------
   APP BOOT
--------------------------------------------------------- */

async function bootApp(){

  await loadCompanyProfile();
  await loadSettings();
  await loadHomeownerProfile();

  const role =
    currentUser?.user_metadata?.role || "contractor";

  if(role==="homeowner"){
    currentPage = "homeowner";
  }else{
    currentPage = "dashboard";
  }

  renderApp();
}

/* ---------------------------------------------------------
   DATABASE LOADERS
--------------------------------------------------------- */

async function loadCompanyProfile(){

  if(!currentUser) return;

  const {data,error} = await supabaseClient
    .from("company_profiles")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
    companyProfile = {};
    return;
  }

  companyProfile = data || {};
}

async function loadSettings(){

  if(!currentUser) return;

  const {data,error} = await supabaseClient
    .from("user_settings")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  userSettings = data || {
    default_valid_days:30,
    default_waste:10,
    default_profit_margin:30,
    default_overhead:10,
    default_layers:1,
    default_pitch:4,
    default_shingle_cost:110,
    default_starter_cost:35,
    default_ridge_cost:35,
    default_labor_cost:90,
    default_tear_off_cost:35,
    default_scope:"",
    default_important_info:"",
    show_phone:true,
    show_email:true,
    show_address:true,
    show_website:true,
    show_logo:true,
    dashboard_widgets:{...defaultWidgets},
    theme:"light"
  };

  if(userSettings.theme){
    setTheme(userSettings.theme);
  }
}

async function loadHomeownerProfile(){

  if(!currentUser) return;

  const {data} = await supabaseClient
    .from("homeowner_profiles")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  homeownerProfile = data || {};
}

async function loadEstimates(){

  if(!currentUser) return;

  const {data,error} = await supabaseClient
    .from("estimates")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("updated_at",{ascending:false});

  if(error){
    console.error(error);
    notify(error.message,"error");
    estimates = [];
    return;
  }

  estimates = data || [];
}

/* ---------------------------------------------------------
   APP UI
--------------------------------------------------------- */

function renderApp(){

  const role =
    currentUser?.user_metadata?.role || "contractor";

  const homeowner = role==="homeowner";

  $("root").innerHTML = `
    <div class="app">

      <header class="topbar">

        <div class="brand">
          ROOF<span>BIDDER</span>
        </div>

        <div class="top-actions">

          <div class="user-pill">
            ${esc(currentUser?.email || "")}
          </div>

          <button
            class="icon-btn mobile-menu"
            onclick="toggleMobileNav()">
            ☰
          </button>

          <button
            class="icon-btn"
            title="Dark / Light Mode"
            onclick="toggleTheme()">
            ◐
          </button>

          <button
            class="icon-btn"
            title="Settings"
            onclick="go('${homeowner?"homeowner":"settings"}')">
            ⚙
          </button>

        </div>

      </header>

      <div class="layout">

        <aside class="sidebar" id="sidebar">

          ${
            homeowner
            ? `
              <button class="nav-btn ${currentPage==="homeowner"?"active":""}"
                onclick="go('homeowner')">
                🏠 Homeowner Portal
              </button>
            `
            : `
              <button class="nav-btn ${currentPage==="dashboard"?"active":""}"
                onclick="go('dashboard')">
                📊 Dashboard
              </button>

              <button class="nav-btn ${currentPage==="calculator"?"active":""}"
                onclick="go('calculator')">
                🧮 Calculator
              </button>

              <button class="nav-btn ${currentPage==="estimates"?"active":""}"
                onclick="go('estimates')">
                📋 Estimates
              </button>

              <button class="nav-btn ${currentPage==="pipeline"?"active":""}"
                onclick="go('pipeline')">
                📈 Pipeline
              </button>

              <button class="nav-btn ${currentPage==="settings"?"active":""}"
                onclick="go('settings')">
                ⚙️ Settings
              </button>

              <button class="nav-btn"
                onclick="go('homeowner')">
                🏠 Homeowner Portal
              </button>
            `
          }

          <div style="height:15px"></div>

          <button class="nav-btn" onclick="logout()">
            🚪 Logout
          </button>

        </aside>

        <main class="main">
          <div class="page" id="page"></div>
        </main>

      </div>
    </div>
  `;

  renderCurrentPage();
}

async function go(page){

  currentPage = page;

  document.querySelectorAll(".nav-btn")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.textContent.toLowerCase().includes(page)
      );
    });

  if(page==="dashboard" ||
     page==="estimates" ||
     page==="pipeline"){
    await loadEstimates();
  }

  renderCurrentPage();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function renderCurrentPage(){

  if(currentPage==="dashboard"){
    renderDashboard();
  }else if(currentPage==="calculator"){
    renderCalculator();
  }else if(currentPage==="estimates"){
    renderEstimates();
  }else if(currentPage==="pipeline"){
    renderPipeline();
  }else if(currentPage==="settings"){
    renderSettings();
  }else if(currentPage==="homeowner"){
    renderHomeownerPortal();
  }
}

  const sidebar = $("sidebar");

function toggleTheme(){

  const next =
    document.body.classList.contains("dark")
      ? "light"
      : "dark";

  setTheme(next);

  if(currentUser){

}

    .from("user_settings")
    .upsert({
      user_id:currentUser.id,
      theme,
      updated_at:new Date().toISOString()
    },{

    });
}

function bindCalculator(){

  [
    "squares",
    "pitch",
    "layers",
    "waste",
    "shingle_cost",
    "starter_cost",
    "ridge_cost",
    "labor_cost",
    "tear_off_cost",
    "other_material",
    "other_labor",
    "overhead",
    "profit_margin",
    "price_adjustment"
  ].forEach(id=>{
    $(id)?.addEventListener("input",calculateEstimate);
    $(id)?.addEventListener("change",calculateEstimate);
  });
}

function calculateEstimate(){

  const squares = Math.max(0,num($("squares")?.value));
  const pitch = Math.max(1,num($("pitch")?.value)||4);
  const layers = Math.max(1,num($("layers")?.value)||1);
  const waste = Math.max(0,num($("waste")?.value));

  const shingle = Math.max(0,num($("shingle_cost")?.value));
  const starter = Math.max(0,num($("starter_cost")?.value));
  const ridge = Math.max(0,num($("ridge_cost")?.value));
  const labor = Math.max(0,num($("labor_cost")?.value));
  const tear = Math.max(0,num($("tear_off_cost")?.value));
  const otherMaterial = Math.max(0,num($("other_material")?.value));
  const otherLabor = Math.max(0,num($("other_labor")?.value));
  const overheadPct = Math.min(100,Math.max(0,num($("overhead")?.value)));
  const marginPct = Math.min(95,Math.max(0,num($("profit_margin")?.value)));
  const adjustment = num($("price_adjustment")?.value);

  const materialSquares =
    squares * (1 + waste/100);

  const pitchMultiplier =
    pitch <= 3 ? 1 :
    pitch <= 6 ? 1.1 :
    pitch <= 9 ? 1.2 :
    1.35;

  const material =
    materialSquares *
      (shingle + starter + ridge)
    + otherMaterial;

  const laborTotal =
    squares * labor * pitchMultiplier
    +
    squares * tear * layers * pitchMultiplier
    +
    otherLabor;

  const base =
    material + laborTotal;

  const overhead =
    base * overheadPct / 100;

  const totalCost =
    base + overhead;

  const selling =
    marginPct >= 100
      ? totalCost + adjustment
      : totalCost / (1 - marginPct/100) + adjustment;

  const grossProfit =
    selling - totalCost;

  const grossMargin =
    selling > 0
      ? grossProfit / selling * 100
      : 0;

  $("calcMaterial").textContent = money(material);
  $("calcLabor").textContent = money(laborTotal);
  $("calcTotal").textContent = money(totalCost);
  $("calcSelling").textContent = money(selling);
  $("calcProfit").textContent = money(grossProfit);
  $("calcMargin").textContent = grossMargin.toFixed(1)+"%";
  $("calcPerSquare").textContent =
    money(squares ? selling/squares : 0);
  $("calcMaterialSquares").textContent =
    materialSquares.toFixed(1);

  const quantities = {
    "Shingles":Math.ceil(materialSquares*3),
    "Starter":Math.ceil(materialSquares),
    "Ridge":Math.ceil(materialSquares/1.5),
    "Underlayment":Math.ceil(materialSquares/2),
    "Ice & Water Rolls":Math.ceil(materialSquares/2),
    "Drip Edge Pieces":Math.ceil(squares)
  };

  $("quantities").innerHTML = `
    <div class="grid grid-3">
      ${Object.entries(quantities).map(([name,value])=>`
        <div class="result">
          <div class="result-label">${name}</div>
          <div class="result-value">${value}</div>
        </div>
      `).join("")}
    </div>
  `;

  window.calculatedEstimate = {
    squares,
    pitch,
    layers,
    waste,
    shingle_cost:shingle,
    starter_cost:starter,
    ridge_cost:ridge,
    labor_cost:labor,
    tear_off_cost:tear,
    other_material:otherMaterial,
    other_labor:otherLabor,
    overhead:overheadPct,
    profit_margin:marginPct,
    price_adjustment:adjustment,
    material_cost:material,
    labor_total:laborTotal,
    total_cost:totalCost,
    selling_price:selling,
    gross_profit:grossProfit,
    gross_margin:grossMargin,
    price_per_square:squares ? selling/squares : 0,
    material_squares:materialSquares
  };
}

async function saveEstimate(){

  calculateEstimate();

  const calc = window.calculatedEstimate;

  const customerName =
    $("customer_name")?.value.trim() || "";

  if(!customerName){
    notify("Customer name is required.","error");
    return;
  }

  const estimate = {
    ...calc,
    user_id:currentUser.id,
    customer_name:customerName,
    customer_phone:$("customer_phone")?.value.trim() || "",
    customer_email:$("customer_email")?.value.trim() || "",
    project_address:$("project_address")?.value.trim() || "",
    valid_days:Number(userSettings.default_valid_days || 30),
    follow_up_date:null,
    follow_up_status:"Not Scheduled",
    follow_up_notes:"",
    scope_of_work:$("scope_of_work")?.value.trim() || "",
    important_info:$("important_info")?.value.trim() || "",
    status:"Lead",
    updated_at:new Date().toISOString()
  };

  if(editingEstimateId){

    const {error} = await supabaseClient
      .from("estimates")
      .update(estimate)
      .eq("id",editingEstimateId)
      .eq("user_id",currentUser.id);

    if(error){
      notify(error.message,"error");
      return;
    }

    notify("Estimate updated.","success");

  }else{

    estimate.estimate_number =
      await nextEstimateNumber();

    const {error} = await supabaseClient
      .from("estimates")
      .insert(estimate);

    if(error){
      notify(error.message,"error");
      return;
    }

    notify("Estimate saved.","success");
  }

  editingEstimateId = null;

  await loadEstimates();

  go("estimates");
}

async function nextEstimateNumber(){

  const year = new Date().getFullYear();

  const count =
    estimates.length + 1;

  return `RB-${year}-${String(count).padStart(4,"0")}`;
}

function editEstimate(id){

  editingEstimateId = id;
  go("calculator");
}

function cancelEdit(){
  editingEstimateId = null;
  go("estimates");
}

async function duplicateEstimate(id){

  const e = estimates.find(x=>x.id===id);

  if(!e) return;

  const copy = {...e};

  delete copy.id;
  delete copy.created_at;
  delete copy.updated_at;

  copy.estimate_number =
    await nextEstimateNumber();

  copy.customer_name =
    (copy.customer_name || "Customer") + " Copy";

  copy.status = "Lead";

  const {error} =
    await supabaseClient
      .from("estimates")
      .insert(copy);

  if(error){
    notify(error.message,"error");
    return;
  }

  await loadEstimates();

  notify("Estimate duplicated.","success");

  renderEstimates();
}

async function deleteEstimate(id){

  if(!confirm("Delete this estimate permanently?")) return;

  const {error} =
    await supabaseClient
      .from("estimates")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){
    notify(error.message,"error");
    return;
  }

  await loadEstimates();

  notify("Estimate deleted.","success");

  renderEstimates();
}

function filterEstimates(){

  const q =
    ($("estimateSearch")?.value || "")
      .toLowerCase();

  document.querySelectorAll("#estimateRows tr")
    .forEach(row=>{
      row.style.display =
        row.dataset.search?.includes(q)
          ? ""
          : "none";
    });
}

async function changeStatus(id,status){

  const {error} =
    await supabaseClient
      .from("estimates")
      .update({
        status,
        updated_at:new Date().toISOString()
      })
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){
    notify(error.message,"error");
    return;
  }

  await loadEstimates();

  notify("Status updated.","success");
}

function randomToken(){

  const bytes =
    new Uint8Array(24);

  crypto.getRandomValues(bytes);

  return Array.from(bytes)
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}

async function createProposal(estimateId){

  const e =
    estimates.find(x=>x.id===estimateId);

  if(!e){
    notify("Estimate not found.","error");
    return;
  }

  const token = randomToken();

  const validDays =
    Number(e.valid_days || userSettings.default_valid_days || 30);

  const validUntil =
    new Date(
      Date.now()+validDays*86400000
    ).toISOString().slice(0,10);

  const row = {
    estimate_id:e.id,
    user_id:currentUser.id,
    public_token:token,

    company_name:companyProfile.company_name || "",
    company_phone:
      userSettings.show_phone !== false
        ? companyProfile.phone || ""
        : "",
    company_email:
      userSettings.show_email !== false
        ? companyProfile.email || ""
        : "",
    company_address:
      userSettings.show_address !== false
        ? companyProfile.address || ""
        : "",
    company_website:
      userSettings.show_website !== false
        ? companyProfile.website || ""
        : "",
    company_logo:
      userSettings.show_logo !== false
        ? companyProfile.logo_data || ""
        : "",

    customer_name:e.customer_name || "",
    customer_email:e.customer_email || "",
    customer_phone:e.customer_phone || "",
    project_address:e.project_address || "",

    estimate_number:e.estimate_number,
    scope_of_work:e.scope_of_work || "",
    important_info:e.important_info || "",
    selling_price:e.selling_price || 0,
    valid_until:validUntil,
    status:"Sent",

    homeowner_email:e.customer_email || "",

    updated_at:new Date().toISOString()
  };

  const {error} =
    await supabaseClient
      .from("public_proposals")
      .insert(row);

  if(error){
    notify(error.message,"error");
    return;
  }

  const url =
    location.origin +
    location.pathname +
    "?proposal=" +
    token;

  try{
    await navigator.clipboard.writeText(url);
    notify(
      "Proposal created. Link copied!",
      "success"
    );
  }catch{
    prompt(
      "Copy this homeowner proposal link:",
      url
    );
  }
}

function safeUrl(url){

  const value =
    String(url || "").trim();

  if(/^https?:\/\//i.test(value)){
    return value;
  }

  return "https://"+value;
}

function proposalLogin(){

  const token =
    new URLSearchParams(location.search)
      .get("proposal");

  sessionStorage.setItem(
    "roofbidder_proposal_token",
    token || ""
  );

  authMode = "homeowner";

  renderAuth();
}

async function claimProposal(token){

  const {data,error} =
    await supabaseClient
      .rpc("claim_public_proposal",{
        p_token:token
      });

  if(error){
    notify(error.message,"error");
    return false;
  }

  if(!data?.ok){
    notify(data?.error || "Could not claim proposal.","error");
    return false;
  }

  return true;
}

async function approveProposal(){

  const token =
    sessionStorage.getItem(
      "roofbidder_proposal_token"
    );

  if(!token){
    notify("Proposal token missing.","error");
    return;
  }

  const name =
    prompt(
      "Enter your full name to approve this proposal:",
      homeownerProfile.full_name ||
      currentUser?.user_metadata?.full_name ||
      ""
    );

  if(!name) return;

  const message =
    prompt(
      "Optional message to the contractor:",
      ""
    ) || "";

  const result =
    await supabaseClient
      .rpc("approve_public_proposal",{
        p_token:token,
        p_homeowner_name:name,
        p_homeowner_message:message
      });

  if(result.error){
    notify(result.error.message,"error");
    return;
  }

  if(!result.data?.ok){
    notify(
      result.data?.error ||
      "Could not approve proposal.",
      "error"
    );
    return;
  }

  await renderPublicProposal(token);
}

                )}
              </h3>

              <div style="
                font-size:26px;
                font-weight:900;
                color:var(--primary)">
                ${money(p.selling_price)}
              </div>

              <div style="margin:10px 0">
                ${statusBadge(
                  p.status || "Sent"
                )}
              </div>

              <div style="color:var(--muted)">
                ${esc(p.project_address || "")}
              </div>

              <div class="btn-row"
                style="margin-top:15px">

                <button
                  class="btn btn-primary"
                  onclick="openProposal('${p.public_token}')">
                  View Proposal
                </button>

                ${
                  p.status!=="Approved"
                  ? `
                  <button
                    class="btn btn-success"
                    onclick="approvePortalProposal('${p.public_token}')">
                    Approve
                  </button>
                  `
                  :""
                }

              </div>

            </div>

          `).join("")}

        </div>
        `
        : `
        <div class="empty">
          No proposals are connected to this account yet.
          <br><br>
          Open the proposal link sent by your contractor
          and log in with this email address.
        </div>
        `
      }

    </div>

    <div class="card" style="margin-top:16px">

      <h3 class="section-title">
        Homeowner Profile
      </h3>

      ${field(
        "homeowner_name",
        "Full Name",
        homeownerProfile.full_name ||
        currentUser.user_metadata?.full_name ||
        ""
      )}

      ${field(
        "homeowner_phone",
        "Phone",
        homeownerProfile.phone || "",
        "tel"
      )}

      <button
        class="btn btn-primary"
        onclick="saveHomeownerProfile()">
        Save Profile
      </button>

    </div>
  `;
}

function openProposal(token){

  const url =
    location.origin +
    location.pathname +
    "?proposal=" +
    encodeURIComponent(token);

  location.href = url;
}

async function approvePortalProposal(token){

  sessionStorage.setItem(
    "roofbidder_proposal_token",
    token
  );

  await approveProposal();
}

async function saveHomeownerProfile(){

  const row = {
    user_id:currentUser.id,
    full_name:$("homeowner_name")?.value.trim() || "",
    phone:$("homeowner_phone")?.value.trim() || "",
    updated_at:new Date().toISOString()
  };

  const {error} =
    await supabaseClient
      .from("homeowner_profiles")
      .upsert(row,{onConflict:"user_id"});

  if(error){
    notify(error.message,"error");
    return;
  }

  await loadHomeownerProfile();

  notify("Profile saved.","success");
}

/* ---------------------------------------------------------
   PUBLIC PROPOSAL HOMEOWNER LOGIN HANDLING
--------------------------------------------------------- */

const originalBootApp = bootApp;

bootApp = async function(){

  await loadCompanyProfile();
  await loadSettings();
  await loadHomeownerProfile();

  const role =
    currentUser?.user_metadata?.role ||
    "contractor";

  const proposalToken =
    sessionStorage.getItem(
      "roofbidder_proposal_token"
    );

  if(role==="homeowner"){

    if(proposalToken){

      const claimed =
        await claimProposal(proposalToken);

      if(claimed){
        await renderPublicProposal(proposalToken);
        return;
      }
    }

    currentPage = "homeowner";

  }else{

    currentPage = "dashboard";
  }

  renderApp();
};

/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

init();

</script>
</body>
</html>
