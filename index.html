<!doctype html>

<head>
<meta charset="utf-8">

<title>RoofBidder</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f7fa;
  --card:#fff;
  --text:#172033;
  --muted:#687386;
  --border:#dfe4eb;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --danger:#dc2626;
  --success:#16a34a;
  --shadow:0 8px 25px rgba(0,0,0,.07)
}

.dark{
  --bg:#0f172a;
  --card:#182235;
  --text:#f8fafc;
  --muted:#aab4c4;
  --border:#334155;
  --shadow:0 8px 25px rgba(0,0,0,.25)
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button{
  border:0;

  font-weight:700
}

input,select,textarea{

textarea{

.app{

.top{

.logo{

.topRight{

.grid2{

.grid3{

.muted{

label{

.field{

.btn{

.btn.secondary{

.btn.success{

.btn.danger{

.actions{

table{

th,td{

h1,h2,h3{

.modalBox{

.public{

  padding:20px

.publicHeader{
  text-align:center;

.publicLogo{
  max-width:240px;

.price{

.notice{

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}

  .app{padding:12px}

"https://ovuirmlmdpbqumriakcm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_79QIWXKGoCtpUwF3t4KTRw_A9lAuao3";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,

let user=null;

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(n){
  return Number(n||0).toLocaleString("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:2
  });
}

function num(id){
  return Math.max(
    0,
    Number($(id)?.value)||0
  );
}

function uuidToken(){
  const bytes=new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
}

function field(id,label,value="",type="text",min="",step="1"){
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <input
        id="${id}"
        type="${type}"
        value="${esc(value)}"
        ${min!==""?`min="${min}"`:""}
        step="${step}"
      >
    </div>
  `;
}

function textarea(id,label,value=""){
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <textarea id="${id}">${esc(value)}</textarea>
    </div>
  `;
}

function selectField(id,label,value,options){
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <select id="${id}">
        ${options.map(o=>
          `<option value="${esc(o[0])}" ${String(value)==String(o[0])?"selected":""}>${esc(o[1])}</option>`
        ).join("")}
      </select>
    </div>
  `;
}


/* =========================================================
AUTH
========================================================= */

function showAuth(){
  $("root").innerHTML=`
    <div class="auth">
      <div class="logo">

      </div>

async function login(){
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    $("authMsg").textContent=error.message;
  }
}

async function signup(){
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;

  const {error}=await supabaseClient.auth.signUp({
    email,
    password
  });

  $("authMsg").textContent=
    error
      ? error.message
      : "Account created. Check your email if confirmation is required.";
}

async function logout(){
  await supabaseClient.auth.signOut();
}


/* =========================================================
COMPANY PROFILE
========================================================= */

async function loadCompany(){
  const {data}=await supabaseClient
    .from("company_profiles")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();

  companyProfile=data || {
    company_name:"",
    phone:"",
    email:"",
    address:"",
    website:"",
    logo_data:""
  };
}

async function saveCompany(){

  const payload={
    user_id:user.id,
    company_name:$("company_name").value.trim(),
    phone:$("company_phone").value.trim(),
    email:$("company_email").value.trim(),
    address:$("company_address").value.trim(),
    website:$("company_website").value.trim(),
    logo_data:companyProfile.logo_data||"",
    updated_at:new Date().toISOString()
  };

  const {data,error}=await supabaseClient
    .from("company_profiles")
    .upsert(payload,{
      onConflict:"user_id"
    })
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  companyProfile=data;

  alert("Company profile saved.");
  renderSettings();
}

function handleLogo(input){

  const file=input.files?.[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    const img=new Image();

    img.onload=()=>{

      const max=700;

      let w=img.width;
      let h=img.height;

      if(w>max){
        h=Math.round(h*max/w);
        w=max;
      }

      const canvas=document.createElement("canvas");

      canvas.width=w;
      canvas.height=h;

      const ctx=canvas.getContext("2d");

      ctx.drawImage(img,0,0,w,h);

      companyProfile.logo_data=
        canvas.toDataURL("image/jpeg",.86);

      renderSettings();
    };

    img.src=reader.result;
  };

  reader.readAsDataURL(file);
}


/* =========================================================
CALCULATOR
========================================================= */

function renderCalculator(v={}){

  $("content").innerHTML=`

    <h1>${editingEstimateId?"Edit Estimate":"Roofing Calculator"}</h1>

    <div class="grid2">

      <div class="card">

        <h3>Customer</h3>

        ${field("customer_name","Customer Name",v.customer_name||"")}
        ${field("customer_phone","Phone",v.customer_phone||"","tel")}
        ${field("customer_email","Email",v.customer_email||"","email")}
        ${field("project_address","Project Address",v.project_address||"")}

      </div>

      <div class="card">

        <h3>Roof</h3>

        ${field("squares","Roof Squares",v.squares??0,"number","0",".1")}

        ${selectField(
          "pitch",
          "Pitch",
          v.pitch??1,
          [
            ["1","Flat / Low"],
            ["1.05","4/12"],
            ["1.10","5/12"],
            ["1.15","6/12"],
            ["1.20","7/12"],
            ["1.25","8/12"],
            ["1.30","9/12"],
            ["1.35","10/12+"]
          ]
        )}

        ${field("layers","Existing Layers",v.layers??1,"number","1","1")}
        ${field("waste","Waste %",v.waste??10,"number","0",".1")}

      </div>

    </div>


    <div class="card">

      <h3>Costs</h3>

      <div class="grid3">

        ${field("shingle_cost","Shingles / Square",v.shingle_cost??0,"number","0",".01")}

        ${field("starter_cost","Starter / Square",v.starter_cost??0,"number","0",".01")}

        ${field("ridge_cost","Ridge / Square",v.ridge_cost??0,"number","0",".01")}

        ${field("labor_cost","Install Labor / Square",v.labor_cost??0,"number","0",".01")}

        ${field("tear_off_cost","Tear-Off / Square / Layer",v.tear_off_cost??0,"number","0",".01")}

        ${field("other_material","Other Materials",v.other_material??0,"number","0",".01")}

        ${field("other_labor","Other Labor",v.other_labor??0,"number","0",".01")}

        ${field("overhead","Overhead %",v.overhead??10,"number","0",".1")}

        ${field("profit_margin","Desired Profit Margin %",v.profit_margin??30,"number","0",".1")}

        ${field("price_adjustment","Price Adjustment",v.price_adjustment??0,"number","","0.01")}

      </div>

    </div>


    <div class="card">

      <h3>Scope & Notes</h3>

      ${textarea(
        "scope_of_work",
        "Scope of Work",
        v.scope_of_work||""
      )}

      ${textarea(
        "important_info",
        "Important Information",
        v.important_info||""
      )}

    </div>


    <div class="card">

      <h3>Estimate Results</h3>

      <div id="calcResults"></div>

      <div class="actions">
        <button class="btn" onclick="saveEstimate()">
          ${editingEstimateId?"Update Estimate":"Save Estimate"}
        </button>

        <button class="btn secondary" onclick="newEstimate()">
          Clear
        </button>
      </div>

    </div>
  `;

  [
    "squares",
    "pitch",
    "layers",
    "waste",
    "shingle_cost",
    "starter_cost",
    "ridge_cost",
    "labor_cost",
    "tear_off_cost",
    "other_material",
    "other_labor",
    "overhead",
    "profit_margin",
    "price_adjustment"
  ].forEach(id=>{
    $(id)?.addEventListener("input",calculate);
    $(id)?.addEventListener("change",calculate);
  });

  calculate();
}


function calculate(){

  if(!$("squares"))return;

  const squares=num("squares");
  const pitch=Number($("pitch").value)||1;
  const layers=Math.max(1,Math.round(num("layers")||1));
  const waste=num("waste")/100;

  const materialSquares=
    squares*(1+waste);

  const shingle=num("shingle_cost");
  const starter=num("starter_cost");
  const ridge=num("ridge_cost");

  const material=
    materialSquares*(shingle+starter+ridge)
    +num("other_material");

  const labor=
    squares*num("labor_cost")*pitch
    +
    squares*num("tear_off_cost")*layers*pitch
    +
    num("other_labor");

  const base=material+labor;

  const overhead=
    base*(num("overhead")/100);

  const totalCost=
    base+overhead;

  const margin=
    Math.min(95,num("profit_margin"))/100;

  const price=
    margin>=.999
      ? totalCost
      : totalCost/(1-margin)
        + Number($("price_adjustment").value||0);

  const profit=price-totalCost;

  const actualMargin=
    price>0
      ? profit/price
      : 0;

  const perSquare=
    squares>0
      ? price/squares
      : 0;


  $("calcResults").innerHTML=`

    <div class="grid">

      <div class="card">
        <div class="muted">Material Cost</div>
        <div class="metric">${money(material)}</div>
      </div>

      <div class="card">
        <div class="muted">Labor</div>
        <div class="metric">${money(labor)}</div>
      </div>

      <div class="card">
        <div class="muted">Total Cost</div>
        <div class="metric">${money(totalCost)}</div>
      </div>

      <div class="card">
        <div class="muted">Selling Price</div>
        <div class="metric">${money(price)}</div>
      </div>

      <div class="card">
        <div class="muted">Gross Profit</div>
        <div class="metric profit">${money(profit)}</div>
      </div>

      <div class="card">
        <div class="muted">Gross Margin</div>
        <div class="metric">${(actualMargin*100).toFixed(1)}%</div>
      </div>

      <div class="card">
        <div class="muted">Price / Square</div>
        <div class="metric">${money(perSquare)}</div>
      </div>

      <div class="card">
        <div class="muted">Material Squares</div>
        <div class="metric">${materialSquares.toFixed(1)}</div>
      </div>

    </div>
  `;
}


/* =========================================================
ESTIMATE SAVE
========================================================= */

function estimatePayload(){

  const squares=num("squares");
  const pitch=Number($("pitch").value)||1;
  const layers=Math.max(1,Math.round(num("layers")||1));
  const waste=num("waste")/100;

  const materialSquares=squares*(1+waste);

  const material=
    materialSquares*
      (
        num("shingle_cost")+
        num("starter_cost")+
        num("ridge_cost")
      )
    +num("other_material");

  const labor=
    squares*num("labor_cost")*pitch+
    squares*num("tear_off_cost")*layers*pitch+
    num("other_labor");

  const base=material+labor;

  const overhead=base*num("overhead")/100;

  const totalCost=base+overhead;

  const margin=Math.min(95,num("profit_margin"))/100;

  const sellingPrice=
    totalCost/(1-margin)
    +
    Number($("price_adjustment").value||0);

  const grossProfit=
    sellingPrice-totalCost;

  const grossMargin=
    sellingPrice>0
      ? grossProfit/sellingPrice
      : 0;

  const now=new Date();

  return {
    user_id:user.id,

    customer_name:$("customer_name").value.trim(),
    customer_phone:$("customer_phone").value.trim(),
    customer_email:$("customer_email").value.trim(),
    project_address:$("project_address").value.trim(),

    estimate_number:
      editingEstimateId
        ? undefined
        : "RB-"+Date.now(),

    valid_days:30,

    squares,
    pitch,
    layers,
    waste:num("waste"),

    shingle_cost:num("shingle_cost"),
    starter_cost:num("starter_cost"),
    ridge_cost:num("ridge_cost"),
    labor_cost:num("labor_cost"),
    tear_off_cost:num("tear_off_cost"),
    other_material:num("other_material"),
    other_labor:num("other_labor"),
    overhead:num("overhead"),
    profit_margin:num("profit_margin"),
    price_adjustment:
      Number($("price_adjustment").value||0),

    scope_of_work:$("scope_of_work").value.trim(),
    important_info:$("important_info").value.trim(),

    material_cost:material,
    labor_total:labor,
    total_cost:totalCost,
    selling_price:sellingPrice,
    gross_profit:grossProfit,
    gross_margin:grossMargin,
    price_per_square:
      squares>0
        ? sellingPrice/squares
        : 0,

    material_squares:materialSquares,

    updated_at:now.toISOString()
  };
}


async function saveEstimate(){

  const payload=estimatePayload();

  let result;

  if(editingEstimateId){

    delete payload.estimate_number;

    result=await supabaseClient
      .from("estimates")
      .update(payload)
      .eq("id",editingEstimateId)
      .select()
      .single();

  }else{

    result=await supabaseClient
      .from("estimates")
      .insert(payload)
      .select()
      .single();
  }

  if(result.error){
    alert(result.error.message);
    return;
  }

  editingEstimateId=result.data.id;

  await loadEstimates();

  alert("Estimate saved.");

  go("estimates");
}


async function loadEstimates(){

  const {data,error}=await supabaseClient
    .from("estimates")
    .select("*")
    .eq("user_id",user.id)
    .order("updated_at",{ascending:false});

  if(error){
    alert(error.message);
    return;
  }

  estimates=data||[];
}

                    class="btn"
                    onclick="createProposal('${e.id}')">
                    Proposal
                  </button>

                  <button
                    class="btn secondary"
                    onclick="duplicateEstimate('${e.id}')">
                    Duplicate
                  </button>

                  <button
                    class="btn danger"
                    onclick="deleteEstimate('${e.id}')">
                    Delete
                  </button>

                </div>
              </td>

            </tr>

          `).join("")}

          </tbody>

        </table>
        </div>
      `}
    </div>
  `;
}


async function editEstimate(id){

  const e=estimates.find(x=>x.id===id);

  if(!e)return;

  editingEstimateId=id;

  go("calculator",e);
}


function duplicateEstimate(id){

  const e=estimates.find(x=>x.id===id);

  if(!e)return;

  editingEstimateId=null;

  go("calculator",{
    ...e,
    customer_name:e.customer_name+" Copy",
    estimate_number:undefined
  });
}


async function deleteEstimate(id){

  if(!confirm("Delete this estimate?"))return;

  const {error}=await supabaseClient
    .from("estimates")
    .delete()
    .eq("id",id)
    .eq("user_id",user.id);

  if(error){
    alert(error.message);
    return;
  }

  await loadEstimates();
  renderEstimates();
}


function newEstimate(){

  editingEstimateId=null;

  go("calculator",{
    pitch:1.15,
    layers:1,
    waste:10,
    overhead:10,
    profit_margin:30
  });
}


/* =========================================================

========================================================= */

function renderDashboard(){

  const active=estimates.filter(e=>
    !["Lost"].includes(e.status)

    ["Sold","Completed"].includes(e.status)

  const lost=estimates.filter(e=>
    e.status==="Lost"
  );

  const revenue=active.reduce(
    (s,e)=>s+Number(e.selling_price||0),0
  );

  const soldRevenue=sold.reduce(
    (s,e)=>s+Number(e.selling_price||0),0
  );

  const profit=sold.reduce(
    (s,e)=>s+Number(e.gross_profit||0),0
  );

  const closeRate=
    sold.length+lost.length
      ? sold.length/(sold.length+lost.length)*100
      : 0;


  $("content").innerHTML=`

    <div class="top">
      <div>
        <h1>Dashboard</h1>
        <p class="muted">
          Welcome back${companyProfile?.company_name
            ? ", "+esc(companyProfile.company_name)
            : ""}.
        </p>
      </div>
    </div>


    <div class="grid">

      <div class="card">
        <div class="muted">Total Estimates</div>
        <div class="metric">${estimates.length}</div>
      </div>

      <div class="card">
        <div class="muted">Projected Revenue</div>
        <div class="metric">${money(revenue)}</div>
      </div>

      <div class="card">
        <div class="muted">Sold Revenue</div>
        <div class="metric">${money(soldRevenue)}</div>
      </div>

      <div class="card">
        <div class="muted">Sold Profit</div>
        <div class="metric profit">${money(profit)}</div>
      </div>

      <div class="card">
        <div class="muted">Close Rate</div>
        <div class="metric">${closeRate.toFixed(1)}%</div>
      </div>

      <div class="card">
        <div class="muted">Open Leads</div>
        <div class="metric">
          ${estimates.filter(e=>
            ["Lead","Estimated"].includes(e.status)
          ).length}
        </div>
      </div>

    </div>


    <div class="card">

      <h3>Recent Estimates</h3>

      ${estimates.slice(0,5).map(e=>`

        <div class="notice">

          <strong>
            ${esc(e.customer_name||"Unnamed Customer")}
          </strong>

          — ${money(e.selling_price)}

          <span class="badge">
            ${esc(e.status||"Lead")}
          </span>

        </div>

      `).join("") || `
        <p class="muted">
          No estimates yet.
        </p>
      `}

    </div>
  `;
}

/* =========================================================
THEME
========================================================= */

function loadTheme(){

  if(
    localStorage.getItem("roofbidder_theme")==="dark"
  ){
    document.body.classList.add("dark");
  }
}

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "roofbidder_theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );
}


/* =========================================================
NAVIGATION
========================================================= */

function toggleMenu(){

  $("dashboardDropdown")
    .classList.toggle("hidden");
}

function go(page,data){

  currentPage=page;

  document.querySelectorAll(".tab")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.dataset.page===page
      );
    });

  $("dashboardDropdown")
    ?.classList.add("hidden");

  if(page==="dashboard"){
    renderDashboard();
  }

  if(page==="calculator"){
    renderCalculator(data||{});
  }

  if(page==="estimates"){
    renderEstimates();
  }

  if(page==="pipeline"){
    renderPipeline();
  }

  if(page==="settings"){
    renderSettings();
  }
}


/* =========================================================
PROPOSALS
========================================================= */

function proposalURL(token){

  return location.origin+
    location.pathname+
    "?proposal="+
    encodeURIComponent(token);
}


async function createProposal(id){

  const e=estimates.find(x=>x.id===id);

  if(!e)return;

  if(!companyProfile){
    await loadCompany();
  }

  const token=uuidToken();

  const validDays=
    Math.max(
      1,
      Number(e.valid_days)||30
    );

  const validDate=new Date();

  validDate.setDate(
    validDate.getDate()+validDays
  );

  const {data,error}=await supabaseClient
    .from("public_proposals")
    .insert({

      estimate_id:e.id,
      user_id:user.id,

      public_token:token,

      company_name:companyProfile.company_name||"",
      company_phone:companyProfile.phone||"",
      company_email:companyProfile.email||"",
      company_address:companyProfile.address||"",
      company_website:companyProfile.website||"",
      company_logo:companyProfile.logo_data||"",

      customer_name:e.customer_name||"",
      customer_email:e.customer_email||"",
      customer_phone:e.customer_phone||"",
      project_address:e.project_address||"",

      estimate_number:e.estimate_number,

      scope_of_work:e.scope_of_work||"",
      important_info:e.important_info||"",

      selling_price:Number(e.selling_price||0),

      valid_until:validDate
        .toISOString()
        .slice(0,10),

      status:"Sent"
    })
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  showProposalLink(
    proposalURL(data.public_token)
  );
}


function showProposalLink(link){

  $("modal").innerHTML=`

    <div class="modalBox">

      <h2>Proposal Created</h2>

      <p>
        Send this link to the homeowner.
      </p>

      <div class="notice">
        ${esc(link)}
      </div>

      <div class="actions">

        <button
          class="btn"
          onclick="copyText('${esc(link)}')">
          Copy Link
        </button>

        <button
          class="btn secondary"
          onclick="window.open('${esc(link)}','_blank')">
          Open Proposal
        </button>

        <button
          class="btn secondary"
          onclick="closeModal()">
          Close
        </button>

      </div>

    </div>
  `;

  $("modal").classList.remove("hidden");
}


async function copyText(text){

  try{
    await navigator.clipboard.writeText(text);
    alert("Copied.");
  }catch{
    prompt("Copy this link:",text);
  }
}


function closeModal(){
  $("modal").classList.add("hidden");
  $("modal").innerHTML="";
}

async function loadPublicProposal(token){

  const {data,error}=await supabaseClient
    .rpc(
      "get_public_proposal",
      {
        p_token:token
      }
    );

  if(error){

    document.body.innerHTML=`
      <div class="public">
        <div class="card">
          <h2>Proposal unavailable</h2>
          <p>${esc(error.message)}</p>
        </div>
      </div>
    `;

    return;
  }

  if(!data){

    document.body.innerHTML=`
      <div class="public">
        <div class="card">
          <h2>Proposal not found</h2>
          <p>
            This proposal link may be invalid or expired.
          </p>
        </div>
      </div>
    `;

    return;
  }

  renderPublicProposal(data,token);
}

  document.body.innerHTML=`

    <div class="public">

      <div class="publicHeader">

        ${
          p.company_logo
            ? `<img
                class="publicLogo"
                src="${p.company_logo}">
              `
            : ""
        }

        <h1>
          ${esc(p.company_name||"Roofing Proposal")}
        </h1>

        ${
          p.company_phone
            ? `<div>${esc(p.company_phone)}</div>`
            : ""
        }

        ${
          p.company_email
            ? `<div>${esc(p.company_email)}</div>`
            : ""
        }

        ${
          p.company_address
            ? `<div>${esc(p.company_address)}</div>`
            : ""
        }

      </div>


      <div class="card">

        <div class="proposalBox">

          <div class="muted">
            Estimate
          </div>

          <h2>
            ${esc(p.estimate_number)}
          </h2>

          <div>
            Customer:
            <strong>
              ${esc(p.customer_name||"")}
            </strong>
          </div>

          <div>
            Project:
            ${esc(p.project_address||"")}
          </div>

        </div>


        <div class="price">
          ${money(p.selling_price)}
        </div>


        <div class="proposalBox">

          <h3>Scope of Work</h3>

          <div style="white-space:pre-wrap">
            ${esc(p.scope_of_work||"")}
          </div>

        </div>


        ${
          p.important_info
            ? `
              <div class="proposalBox">

                <h3>Important Information</h3>

                <div style="white-space:pre-wrap">
                  ${esc(p.important_info)}
                </div>

              </div>
            `
            :""
        }


        ${
          p.company_website
            ? `
              <div class="notice">
                Website:
                ${esc(p.company_website)}
              </div>
            `
            :""
        }


        <div class="notice">

          Valid until:
          <strong>
            ${esc(p.valid_until||"")}
          </strong>

        </div>


        ${
          approved
            ? `
              <div class="approved">

                ✓ Proposal Approved

                <br>

                Approved by:
                ${esc(p.homeowner_name)}

                <br>

                Approved:
                ${p.approved_at
                  ? new Date(p.approved_at)
                    .toLocaleString()
                  : ""}

                ${
                  p.homeowner_message
                    ? `
                      <br><br>
                      Message:
                      ${esc(p.homeowner_message)}
                    `
                    :""
                }

              </div>
            `
            : expired
              ? `
                <div class="notice">
                  This proposal has expired.
                </div>
              `
              : `
                <div class="proposalBox">

                  <h3>Approve Proposal</h3>

                  <p class="muted">
                    If you would like to approve this proposal,
                    enter your name below.
                  </p>

                  ${field(
                    "homeowner_name",
                    "Your Name"
                  )}

                  ${textarea(
                    "homeowner_message",
                    "Message (optional)"
                  )}

                  <button
                    class="btn success"
                    onclick="approveProposal('${esc(token)}')">
                    Approve Proposal
                  </button>

                </div>
              `
        }

      </div>

      <p class="muted" style="text-align:center">
        Powered by RoofBidder
      </p>

    </div>
  `;
}


async function approveProposal(token){

  const name=$("homeowner_name")
    .value
    .trim();

  const message=$("homeowner_message")
    .value
    .trim();

  if(name.length<2){
    alert("Please enter your name.");
    return;
  }

  if(!confirm(
    "Approve this roofing proposal?"
  )){
    return;
  }

  const {data,error}=await supabaseClient
    .rpc(
      "approve_public_proposal",
      {
        p_token:token,
        p_homeowner_name:name,
        p_homeowner_message:message
      }
    );

  if(error){
    alert(error.message);
    return;
  }

  if(!data?.ok){
    alert(
      data?.error||
      "Unable to approve proposal."
    );
    return;
  }

  await loadPublicProposal(token);
}

/* =========================================================
STARTUP
========================================================= */

async function start(){

  loadTheme();

  const params=
    new URLSearchParams(location.search);

  const proposal=
    params.get("proposal");

  if(proposal){

    await loadPublicProposal(proposal);
    return;

  }


  const {data}=
    await supabaseClient.auth.getSession();

  user=data.session?.user||null;

  if(!user){

    showAuth();
    return;

  }

  await loadCompany();
  await loadEstimates();

  renderApp();
}


supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    user=session?.user||null;

    if(
      event==="SIGNED_IN" &&
      user
    ){

      await loadCompany();
      await loadEstimates();
      renderApp();

    }

    if(event==="SIGNED_OUT"){
      showAuth();
    }

  }
);


start();
