<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofBidder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --primary:#1769ff;
  --primary2:#0f56d9;
  --success:#12a150;
  --danger:#dc3545;
  --warning:#e99b00;
  --shadow:0 8px 30px rgba(15,23,42,.07);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#10151d;
  --card:#18202b;
  --text:#f4f7fb;
  --muted:#aab4c3;
  --line:#2b3645;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--card);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 15px rgba(0,0,0,.04);
}

.topbar-inner{
  max-width:1250px;
  margin:auto;
  min-height:70px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  letter-spacing:.5px;
  font-size:21px;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--primary);
  color:white;
  display:grid;
  place-items:center;
  font-weight:900;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn,
.menu-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:9px 12px;
}

.icon-btn:hover,
.menu-btn:hover{
  background:var(--bg);
}

.tabs{
  max-width:1250px;
  margin:auto;
  padding:0 18px 10px;
  display:flex;
  gap:6px;
  overflow-x:auto;
}

.tab{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 12px;
  border-radius:9px;
  white-space:nowrap;
}

.tab.active{
  background:var(--primary);
  color:white;
  font-weight:700;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:24px 18px 60px;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.page-title h1{
  margin:0;
  font-size:28px;
}

.page-title p{
  margin:5px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.stat{
  min-height:125px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:9px;
}

.stat-value{
  font-size:27px;
  font-weight:900;
}

.stat-sub{
  margin-top:7px;
  font-size:12px;
  color:var(--muted);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:0 0 15px;
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(23,105,255,.12);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.field{
  margin-bottom:13px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:800;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{
  background:var(--primary2);
}

.btn-secondary{
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
}

.btn-success{
  background:var(--success);
  color:white;
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-warning{
  background:var(--warning);
  color:white;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.calc-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:18px;
}

.summary-box{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  background:var(--bg);
}

.summary-box small{
  color:var(--muted);
}

.summary-box strong{
  display:block;
  font-size:20px;
  margin-top:5px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
}

th{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  background:var(--bg);
  border:1px solid var(--line);
}

.badge.green{
  color:var(--success);
}

.badge.red{
  color:var(--danger);
}

.badge.blue{
  color:var(--primary);
}

.badge.orange{
  color:var(--warning);
}

.pipeline{
  display:grid;
  grid-template-columns:repeat(5,minmax(190px,1fr));
  gap:12px;
  overflow-x:auto;
}

.pipeline-column{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  min-height:250px;
}

.pipeline-column h3{
  margin:0 0 10px;
  font-size:14px;
}

.pipeline-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  margin-bottom:8px;
}

.pipeline-card strong{
  display:block;
  margin-bottom:4px;
}

.pipeline-card small{
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-card{
  width:min(850px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border-radius:18px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:9px;
  padding:8px 11px;
}

.auth-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:var(--bg);
}

.auth-card{
  width:min(470px,100%);
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:20px;
  padding:28px;
}

.auth-logo{
  text-align:center;
  margin-bottom:25px;
}

.auth-logo .brand{
  justify-content:center;
  font-size:26px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  background:var(--bg);
  padding:5px;
  border-radius:11px;
  margin-bottom:18px;
}

.auth-tab{
  border:0;
  padding:10px;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-weight:800;
}

.auth-tab.active{
  background:var(--card);
  color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.auth-message{
  margin-top:12px;
  font-size:13px;
  color:var(--danger);
}

.menu{
  position:absolute;
  right:18px;
  top:62px;
  z-index:80;
  width:220px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:var(--shadow);
  padding:7px;
}

.menu button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--text);
  padding:11px;
  border-radius:8px;
}

.menu button:hover{
  background:var(--bg);
}

.setting-section{
  margin-bottom:18px;
}

.setting-section h3{
  margin:0 0 14px;
  font-size:17px;
}

.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.toggle{
  position:relative;
  width:46px;
  height:25px;
}

.toggle input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  border-radius:30px;
  background:#98a2b3;
  transition:.2s;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.toggle input:checked + .slider{
  background:var(--primary);
}

.toggle input:checked + .slider:before{
  transform:translateX(21px);
}

.logo-preview{
  max-width:220px;
  max-height:90px;
  object-fit:contain;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
  background:white;
}

.proposal{
  max-width:850px;
  margin:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.proposal-header{
  padding:28px;
  border-bottom:1px solid var(--line);
}

.proposal-logo{
  max-width:240px;
  max-height:90px;
  object-fit:contain;
  margin-bottom:15px;
}

.proposal-company{
  font-size:26px;
  font-weight:900;
}

.proposal-contact{
  color:var(--muted);
  margin-top:7px;
  line-height:1.6;
}

.proposal-body{
  padding:28px;
}

.proposal-price{
  font-size:40px;
  font-weight:900;
  margin:10px 0 20px;
}

.proposal-block{
  margin:25px 0;
}

.proposal-block h3{
  margin-bottom:8px;
}

.proposal-block p{
  white-space:pre-wrap;
  line-height:1.65;
}

.portal-card{
  cursor:pointer;
  transition:.15s;
}

.portal-card:hover{
  transform:translateY(-2px);
}

.notice{
  padding:12px 14px;
  border-radius:10px;
  background:rgba(23,105,255,.08);
  border:1px solid rgba(23,105,255,.2);
  margin-bottom:15px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}

@media(max-width:900px){
  .grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .grid-3{
    grid-template-columns:1fr 1fr;
  }

  .pipeline{
    grid-template-columns:repeat(5,190px);
  }
}

@media(max-width:650px){
  .container{
    padding:18px 12px 50px;
  }

  .topbar-inner{
    padding:10px 12px;
  }

  .tabs{
    padding:0 12px 8px;
  }

  .page-title{
    align-items:flex-start;
    flex-direction:column;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .calc-summary{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:16px;
  }

  .proposal-header,
  .proposal-body{
    padding:20px;
  }

  .proposal-price{
    font-size:32px;
  }
}

@media print{
  body{
    background:white!important;
  }

  .no-print{
    display:none!important;
  }

  .proposal{
    box-shadow:none;
    border:0;
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>
/* =========================================================
   ROOFBIDDER V8.2.1
   ========================================================= */

const SUPABASE_URL =
  "https://ovuirmlmdpbqumriakcm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_79QIWXKGoCtpUwF3t4KTRw_A9lAuao3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let currentUser = null;
let currentRole = "contractor";

let estimates = [];
let proposals = [];

let companyProfile = {};
let userSettings = {};
let homeownerProfile = {};

let currentEstimateId = null;
let currentPage = "dashboard";

let authMode = "contractor";
let publicProposal = null;

const defaultSettings = {
  default_valid_days:30,
  default_waste:10,
  default_profit_margin:30,
  default_overhead:10,
  default_layers:1,
  default_pitch:4,
  default_shingle_cost:110,
  default_starter_cost:35,
  default_ridge_cost:35,
  default_labor_cost:90,
  default_tear_off_cost:35,
  default_scope:"",
  default_important_info:"",
  show_phone:true,
  show_email:true,
  show_address:true,
  show_website:true,
  show_logo:true,
  dashboard_widgets:{
    revenue:true,
    profit:true,
    soldLost:true,
    closeRate:true,
    followups:true,
    recent:true,
    pipeline:true
  },
  theme:"light"
};


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  return Number(value || 0).toLocaleString("en-US",{
    style:"currency",
    currency:"USD"
  });
}

function num(value){
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function dateOnly(value){
  if(!value) return "";
  return new Date(value).toLocaleDateString();
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function futureDate(days){
  const d = new Date();
  d.setDate(d.getDate()+Number(days || 30));
  return d.toISOString().slice(0,10);
}

function randomToken(){
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
}

function isExpired(date){
  if(!date) return false;
  return new Date(date+"T23:59:59") < new Date();
}

function setTheme(theme){
  document.body.classList.toggle("dark",theme==="dark");
}

function getWidgets(){
  return {
    ...defaultSettings.dashboard_widgets,
    ...(userSettings.dashboard_widgets || {})
  };
}

function notify(message){
  alert(message);
}


/* =========================================================
   AUTH
   ========================================================= */

async function getSession(){

  const {data,error} =
    await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    return null;
  }

  return data.session;
}


async function boot(){

  const params =
    new URLSearchParams(location.search);

  const proposalToken =
    params.get("proposal");

  if(proposalToken){

    await loadPublicProposal(proposalToken);

    return;
  }

  const session =
    await getSession();

  if(session){

    await handleLoggedInUser(session.user);

  }else{

    renderAuth();

  }

  supabaseClient.auth.onAuthStateChange(
    async (_event,session)=>{

      if(session?.user){

        currentUser = session.user;

        await handleLoggedInUser(
          session.user
        );

      }else{

        currentUser = null;

        renderAuth();

      }

    }
  );
}


async function handleLoggedInUser(user){

  currentUser = user;

  currentRole =
    user.user_metadata?.role ||
    "contractor";

  if(currentRole === "homeowner"){

    await loadHomeownerData();

    renderHomeownerPortal();

  }else{

    currentRole = "contractor";

    await loadContractorData();

    renderApp();

  }
}


async function login(){

  const email =
    document.getElementById("authEmail").value.trim();

  const password =
    document.getElementById("authPassword").value;

  if(!email || !password){

    showAuthMessage(
      "Enter your email and password."
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showAuthMessage(error.message);

    return;
  }

  if(authMode === "homeowner"){

    if(data.user.user_metadata?.role !== "homeowner"){

      await supabaseClient.auth.signOut();

      showAuthMessage(
        "That account is not registered as a homeowner account."
      );

    }

  }
}


async function signup(){

  const name =
    document.getElementById("authName")?.value.trim();

  const email =
    document.getElementById("authEmail").value.trim();

  const password =
    document.getElementById("authPassword").value;

  if(authMode === "homeowner" && !name){

    showAuthMessage(
      "Enter your name."
    );

    return;
  }

  if(!email || !password){

    showAuthMessage(
      "Enter your email and password."
    );

    return;
  }

  if(password.length < 6){

    showAuthMessage(
      "Password must be at least 6 characters."
    );

    return;
  }

  const metadata =
    authMode === "homeowner"
      ? {
          role:"homeowner",
          full_name:name
        }
      : {
          role:"contractor"
        };

  const {data,error} =
    await supabaseClient.auth.signUp({

      email,

      password,

      options:{
        data:metadata
      }

    });

  if(error){

    showAuthMessage(error.message);

    return;
  }

  if(data.session){

    return;
  }

  showAuthMessage(
    "Account created. Check your email if confirmation is required."
  );
}


async function logout(){

  await supabaseClient.auth.signOut();

  location.href =
    location.pathname;
}


function showAuthMessage(message){

  const el =
    document.getElementById("authMessage");

  if(el){

    el.textContent = message;

  }
}


/* =========================================================
   AUTH SCREEN
   ========================================================= */

function renderAuth(){

  document.body.classList.remove("dark");

  document.getElementById("root").innerHTML = `

    <div class="auth-screen">

      <div class="auth-card">

        <div class="auth-logo">

          <div class="brand">
            <div class="brand-mark">R</div>
            ROOFBIDDER
          </div>

          <p style="color:var(--muted)">
            Roofing estimates. Built for profit.
          </p>

        </div>

        <div class="auth-tabs">

          <button
            class="auth-tab ${authMode==="contractor"?"active":""}"
            onclick="setAuthMode('contractor')">

            Contractor

          </button>

          <button
            class="auth-tab ${authMode==="homeowner"?"active":""}"
            onclick="setAuthMode('homeowner')">

            Homeowner

          </button>

        </div>

        <h2 style="margin-top:0">
          ${authMode==="contractor"
            ? "Contractor Login"
            : "Homeowner Portal"}
        </h2>

        <p style="color:var(--muted);font-size:14px">

          ${authMode==="contractor"
            ? "Manage estimates, proposals, customers and your roofing pipeline."
            : "Log in to view and approve your roofing proposal."}

        </p>

        <div id="signupNameWrap"
             class="${authMode==="homeowner"?"":"hidden"}">

          <div class="field">

            <label>Full Name</label>

            <input
              id="authName"
              placeholder="John Smith">

          </div>

        </div>

        <div class="field">

          <label>Email</label>

          <input
            id="authEmail"
            type="email"
            placeholder="you@example.com">

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="authPassword"
            type="password"
            placeholder="••••••••">

        </div>

        <div class="actions">

          <button
            class="btn btn-primary"
            onclick="login()">

            Log In

          </button>

          <button
            class="btn btn-secondary"
            onclick="signup()">

            Create Account

          </button>

        </div>

        <div
          id="authMessage"
          class="auth-message">
        </div>

      </div>

    </div>
  `;
}


function setAuthMode(mode){

  authMode = mode;

  renderAuth();

}


/* =========================================================
   CONTRACTOR DATA
   ========================================================= */

async function loadContractorData(){

  await Promise.all([

    loadEstimates(),

    loadCompanyProfile(),

    loadSettings(),

    loadProposals()

  ]);

  setTheme(
    userSettings.theme || "light"
  );

}


async function loadEstimates(){

function toggleMenu(force){

  const menu =
    document.getElementById("topMenu");

  if(!menu) return;

  if(force === false){

    menu.classList.add("hidden");

    return;
  }

  menu.classList.toggle("hidden");

}


function go(page){

  currentPage = page;

  document
    .querySelectorAll(".tab")
    .forEach(x =>
      x.classList.toggle(
        "active",
        x.dataset.page === page
      )
    );

  const pageEl =
    document.getElementById("page");

  if(!pageEl) return;

  if(page==="dashboard")
    renderDashboard();

  if(page==="calculator")
    renderCalculator();

  if(page==="estimates")
    renderEstimates();

  if(page==="pipeline")
    renderPipeline();

  if(page==="settings")
    renderSettings();

}

function calculateEstimate(v){

  const materialSquares =
    v.squares * (1 + v.waste/100);

  let pitchMultiplier = 1;

  if(v.pitch >= 12)
    pitchMultiplier = 1.35;

  else if(v.pitch >= 9)
    pitchMultiplier = 1.25;

  else if(v.pitch >= 7)
    pitchMultiplier = 1.18;

  else if(v.pitch >= 6)
    pitchMultiplier = 1.12;

  else if(v.pitch >= 5)
    pitchMultiplier = 1.08;

  else if(v.pitch >= 4)
    pitchMultiplier = 1.04;


  const materialCost =
    materialSquares *
    (
      v.shingle_cost +
      v.starter_cost +
      v.ridge_cost
    )
    + v.other_material;


  const installLabor =
    v.squares *
    v.labor_cost *
    pitchMultiplier;


  const tearOff =
    v.squares *
    v.tear_off_cost *
    v.layers *
    pitchMultiplier;


  const laborTotal =
    installLabor +
    tearOff +
    v.other_labor;


  const base =
    materialCost +
    laborTotal;


  const overheadAmount =
    base * (v.overhead/100);


  const totalCost =
    base + overheadAmount;


  const margin =
    Math.min(
      Math.max(v.profit_margin,0),
      99
    );


  const sellingPrice =
    totalCost /
    (1 - margin/100)
    + v.price_adjustment;


  const grossProfit =
    sellingPrice -
    totalCost;


  const grossMargin =
    sellingPrice
      ? grossProfit/sellingPrice*100
      : 0;


  const pricePerSquare =
    v.squares
      ? sellingPrice/v.squares
      : 0;


  return {

    materialSquares,

    materialCost,

    laborTotal,

    overheadAmount,

    totalCost,

    sellingPrice,

    grossProfit,

    grossMargin,

    pricePerSquare,

    quantities:{

      shingles:
        Math.ceil(materialSquares*3),

      starter:
        Math.ceil(materialSquares),

      ridge:
        Math.ceil(materialSquares/1.5),

      underlayment:
        Math.ceil(materialSquares/2),

      iceRolls:
        Math.ceil(materialSquares/2),

      dripPieces:
        Math.ceil(v.squares)

    }

  };

}

  const v =

  if(!v.customer_name){

      v.waste,

    shingle_cost:
      v.shingle_cost,

    starter_cost:
      v.starter_cost,

    ridge_cost:
      v.ridge_cost,

    labor_cost:
      v.labor_cost,

    tear_off_cost:
      v.tear_off_cost,

    other_material:
      v.other_material,

    other_labor:
      v.other_labor,

    overhead:
      v.overhead,

    profit_margin:
      v.profit_margin,

    price_adjustment:
      v.price_adjustment,

    scope_of_work:
      v.scope_of_work,

    important_info:
      v.important_info,

    material_cost:
      r.materialCost,

    labor_total:
      r.laborTotal,

    total_cost:
      r.totalCost,

    selling_price:
      r.sellingPrice,

    gross_profit:
      r.grossProfit,

    gross_margin:
      r.grossMargin,

    price_per_square:
      r.pricePerSquare,

    material_squares:
      r.materialSquares

  };


  let result;

  if(currentEstimateId){

    result =
      await supabaseClient
        .from("estimates")
        .update(payload)
        .eq("id",currentEstimateId)
        .select()
        .single();

  }else{

    result =
      await supabaseClient
        .from("estimates")
        .insert(payload)
        .select()
        .single();

  }


  if(result.error){

    notify(
      result.error.message
    );

    return;
  }


  await loadEstimates();

  currentEstimateId =
    result.data.id;

  notify(
    currentEstimateId
      ? "Estimate saved."
      : "Estimate saved."
  );

  go("estimates");

}

   ========================================================= */

function nextEstimateNumber(){

  const year =
    new Date().getFullYear();

  const numbers =
    estimates
      .map(e=>{
        const match =
          String(e.estimate_number || "")
            .match(/(\d+)$/);

        return match
          ? Number(match[1])
          : 0;
      });

  const next =
    Math.max(0,...numbers)+1;

  return `RB-${year}-${String(next).padStart(4,"0")}`;
}

async function changeStatus(id,status){

  const {error} =
    await supabaseClient
      .from("estimates")
      .update({
        status,
        updated_at:new Date().toISOString()
      })
      .eq("id",id);

  if(error){

    notify(error.message);

    return;
  }

  await loadEstimates();

  filterEstimates();

}


async function duplicateEstimate(id){

  const e =
    estimates.find(x=>x.id===id);

  if(!e) return;

  const copy = {
    ...e
  };

  delete copy.id;

  copy.estimate_number =
    nextEstimateNumber();

  copy.status =
    "Lead";

  copy.created_at =
    undefined;

  copy.updated_at =
    undefined;

  copy.saved_at =
    undefined;

  const {error} =
    await supabaseClient
      .from("estimates")
      .insert(copy);

  if(error){

    notify(error.message);

    return;
  }

  await loadEstimates();

  notify("Estimate duplicated.");

  renderEstimates();

}


async function deleteEstimate(id){

  if(!confirm(
    "Delete this estimate? This cannot be undone."
  )) return;

  const {error} =
    await supabaseClient
      .from("estimates")
      .delete()
      .eq("id",id);

  if(error){

    notify(error.message);

    return;
  }

  await loadEstimates();

  renderEstimates();

}


async function markFollowupDone(id){

    await supabaseClient

        follow_up_status:"Done",

      })
      .eq("id",id);

}

  if(settingsError){

    notify(
      "Settings error: "+
      settingsError.message
    );

    return;
  }


  setTheme(
    userSettings.theme
  );

  notify(
    "Settings saved."
  );

  await loadContractorData();

  renderSettings();

}


function previewLogo(event){

  const file =
    event.target.files?.[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = e=>{

    document.getElementById(
      "logoPreviewWrap"
    ).innerHTML = `

      <img
        class="logo-preview"
        src="${e.target.result}">

    `;

  };

  reader.readAsDataURL(file);

}


function getSelectedLogo(){

  return new Promise(resolve=>{

    const input =
      document.getElementById("setting_logo");

    const file =
      input?.files?.[0];

    if(!file){

      resolve(null);

      return;
    }

    const reader =
      new FileReader();

    reader.onload = event=>{

      const img =
        new Image();

      img.onload = ()=>{

        const max =
          700;

        let width =
          img.width;

        let height =
          img.height;

        if(width > max){

          height =
            height * max / width;

          width =
            max;

        }

        if(height > max){

          width =
            width * max / height;

          height =
            max;

        }

        const canvas =
          document.createElement("canvas");

        canvas.width =
          width;

        canvas.height =
          height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            .86
          )
        );

      };

      img.src =
        event.target.result;

    };

    reader.readAsDataURL(file);

  });

}

/* =========================================================

   ========================================================= */

async function openProposalForEstimate(id){

  const e =
    estimates.find(x=>x.id===id);

  if(!e) return;

  const existing =
    proposals.find(
      p=>p.estimate_id===id
      && p.status!=="Approved"
    );

  if(existing){

    openProposal(existing.public_token);

    return;
  }


  const token =
    randomToken();

  const validUntil =
    futureDate(
      e.valid_days ||
      userSettings.default_valid_days ||
      30
    );


  const p = {

    estimate_id:
      e.id,

    user_id:
      currentUser.id,

    public_token:
      token,

    company_name:
      companyProfile.company_name || "",

    company_phone:
      companyProfile.phone || "",

    company_email:
      companyProfile.email || "",

    company_address:
      companyProfile.address || "",

    company_website:
      companyProfile.website || "",

    company_logo:
      companyProfile.logo_data || "",

    customer_name:
      e.customer_name || "",

    customer_email:
      e.customer_email || "",

    customer_phone:
      e.customer_phone || "",

    project_address:
      e.project_address || "",

    estimate_number:
      e.estimate_number || "",

    scope_of_work:
      e.scope_of_work || "",

    important_info:
      e.important_info || "",

    selling_price:
      e.selling_price || 0,

    valid_until:
      validUntil,

    status:
      "Sent",

    homeowner_email:
      e.customer_email || ""

  };


  const {data,error} =
    await supabaseClient
      .from("public_proposals")
      .insert(p)
      .select()
      .single();


  if(error){

    notify(
      "Proposal error: "+
      error.message
    );

    return;
  }


  await loadProposals();

  openProposal(
    data.public_token
  );

}


function proposalURL(token){

  return (
    location.origin +
    location.pathname +
    "?proposal=" +
    encodeURIComponent(token)
  );

}


function openProposal(token){

  const url =
    proposalURL(token);

  window.open(
    url,
    "_blank"
  );

}


function proposalFromEstimate(id){

  const p =
    proposals.find(
      x=>x.estimate_id===id
    );

  if(!p){

    openProposalForEstimate(id);

    return;
  }

  openProposal(p.public_token);

}


/* =========================================================

   ========================================================= */

async function loadPublicProposal(token){

  const {data,error} =
    await supabaseClient.rpc(
      "get_public_proposal",
      {
        p_token:token
      }
    );


  if(error){

    renderPublicProposalError(
      error.message
    );

    return;
  }

  if(!data){

    renderPublicProposalError(
      "Proposal not found."
    );

    return;
  }

  publicProposal =
    data;

  renderPublicProposal();

}

}

            `

          ${
            p.company_website
            ? `
              <div class="proposal-contact">

                <a
                  href="${esc(normalizeURL(p.company_website))}"
                  target="_blank"
                  rel="noopener">

                  ${esc(p.company_website)}

                </a>

              </div>
            `
            : ""
          }

        </div>


        <div class="proposal-body">

          <div style="color:var(--muted)">
            Estimate ${esc(p.estimate_number)}
          </div>

          <h2>
            ${esc(
              p.customer_name ||
              "Homeowner"
            )}
          </h2>

          ${
            p.project_address
            ? `
              <div style="color:var(--muted)">
                ${esc(p.project_address)}
              </div>
            `
            : ""
          }


          <div class="proposal-price">

            ${money(p.selling_price)}

          </div>


          <div class="proposal-block">

            <h3>
              Scope of Work
            </h3>

            <p>
              ${esc(
                p.scope_of_work ||
                "Roofing work as discussed with your contractor."
              )}
            </p>

          </div>


          ${
            p.important_info
            ? `
              <div class="proposal-block">

                <h3>
                  Important Information
                </h3>

                <p>
                  ${esc(p.important_info)}
                </p>

              </div>
            `
            : ""
          }


          <div class="proposal-block">

            <h3>
              Proposal Valid Until
            </h3>

            <p>
              ${
                p.valid_until
                ? dateOnly(p.valid_until)
                : "No expiration date"
              }
            </p>

          </div>


          ${
            approved
            ? `
              <div class="notice"
                   style="border-color:rgba(18,161,80,.3)">

                <strong>
                  ✅ Proposal Approved

function normalizeURL(url){

  if(!url) return "";

  if(
    url.startsWith("http://")
    || url.startsWith("https://")
  ){

    return url;

  }

  return "https://" + url;

}


async function homeownerLoginFromProposal(){

  localStorage.setItem(
    "roofbidder_return_proposal",
    new URLSearchParams(
      location.search
    ).get("proposal") || ""
  );

  authMode =
    "homeowner";

  renderAuth();

}


async function approveCurrentProposal(){

  const name =
    document.getElementById(
      "approvalName"
    )?.value.trim();

  const message =
    document.getElementById(
      "approvalMessage"
    )?.value.trim() || "";


  if(!name){

    notify(
      "Enter your name."
    );

    return;
  }


  const {data,error} =
    await supabaseClient.rpc(
      "approve_public_proposal",
      {
        p_token:
          new URLSearchParams(
            location.search
          ).get("proposal"),

        p_homeowner_name:
          name,

        p_homeowner_message:
          message

      }
    );


  if(error){

    notify(error.message);

    return;
  }


  if(!data?.ok){

    notify(
      data?.error ||
      "Approval failed."
    );

    return;
  }


  notify(
    "Proposal approved!"
  );


  await loadPublicProposal(
    new URLSearchParams(
      location.search
    ).get("proposal")
  );

}
